<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  </head>
  <body>
    <main>
      <div class="filters-cart-row">
        <div class="filters">
          <button autofocus>All</button>
          <button>Beauty</button>
          <button>Clothing</button>
          <button>Electronics</button>
          <button>Food</button>
          <button>Home</button>
          <button>Sports</button>
          <button>Vehicles</button>
        </div>
        <div class="cart-wrapper">
          <button class="cart-btn"><i class="bi bi-cart3"></i>Cart</button>
        </div>
        <div class="cart-count">
          <p>1</p>
        </div>
      </div>
      <div class="search">
        <input type="text" placeholder="Search products...">
      </div>
      <div id="product-list"></div>
    </main>

    <div class="cart-page-wrapper">
      <div class="cart-heading">
        <h1>Shopping Cart</h1>
        <button class="close-cart-btn">Close</button>
      </div>
      <div class="item-wrapper">
        <div class="item-list">
          <div class="checkout-img">
            <img src="placeholder.png">
          </div>
          <div class="checkout-name-cost">
            <p class="checkout-name">Vintage Typewriter asdasd asdasdasd asddasdas asdasda</p>
            <p class="checkout-cost">$120.00</p>
          </div>
          <div class="checkout-item-count">
            <button class="decrease">-</button>
            <p class="item-count">1</p>
            <button class="increase">+</button>
          </div>
          <div class="checkout-item-total">
            <p class="item-count-price">$120.00</p>
            <p class="remove">Remove</p>
          </div>
        </div>
      </div>
      <div class="total-cost">
        <p>Total $0.00</p>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
